[package]
name = "archlens"
version = "0.1.0"
edition = "2024"
description = "Language-agnostic Clean Architecture coupling, Main Sequence (A/I), cycle, and dependency analyzer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/scffs/archlens"
keywords = ["architecture", "dependencies", "static-analysis", "clean-architecture", "metrics"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "archlens"
path = "src/lib.rs"

[[bin]]
name = "archlens"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
petgraph = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.19"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
