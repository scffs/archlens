name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust checking components
        run: rustup component add --toolchain stable rustfmt clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: archlens-stable
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        run: cargo +stable fmt --all -- --check
      - name: Run strict Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests and architecture checks
        run: cargo +stable test --locked
      - name: Analyze Archlens with its CLI
        run: cargo +stable run --locked --quiet -- analyze . --view modules --no-git --fail-on-cycles --quiet
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check embedded JavaScript syntax in Bun
        run: >-
          bun build --target=browser --no-bundle
          --outdir "$RUNNER_TEMP/report-syntax" src/report/assets/*.js
      - name: Test report graph and simulation in Bun
        run: bun test --coverage ./tests/report_model.test.js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify report model compatibility in Bun and Node
        run: bun run tests/report_runtime_compat.ts
