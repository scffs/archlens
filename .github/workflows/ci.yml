name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust tests and architecture checks
        run: cargo +stable test --locked
      - name: Check embedded JavaScript syntax
        run: |
          for asset in src/report/assets/*.js
          do
            node --check "$asset"
          done
      - name: Test report graph and simulation behavior
        run: node --test tests/*.test.js
