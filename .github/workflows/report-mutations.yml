name: Report robustness

'on':
  pull_request:
    paths:
      - 'src/report/**'
      - 'tests/report_browser.test.cjs'
      - '.github/workflows/report-mutations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARCHLENS_BIN: ${{ github.workspace }}/target/debug/archlens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the offline report generator
        run: cargo +stable build --locked
      - name: Verify the offline report in Chrome
        run: node --test tests/report_browser.test.cjs
