name: Report robustness

'on':
  pull_request:
    paths:
      - 'src/report/**'
      - 'tests/report_model.test.js'
      - '.bun-version'
      - 'tests/report_browser.test.mjs'
      - '.github/report-mutations.config.mjs'
      - '.github/workflows/report-mutations.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: JavaScript mutation scope
        type: choice
        default: core
        options:
          - core
          - all

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      assets: ${{ steps.assets.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: assets
        env:
          REPORT_MUTATION_SCOPE: ${{ inputs.scope || 'core' }}
        run: |
          bun -e '
            const assets = Bun.env.REPORT_MUTATION_SCOPE === "all"
              ? [...new Bun.Glob("*.js").scanSync("src/report/assets")].sort()
              : ["core"];
            console.log("list=" + JSON.stringify(assets));
          ' >> "$GITHUB_OUTPUT"

  report:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.asset == 'core' && 10 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.scope.outputs.assets) }}
    env:
      REPORT_MUTATION_ASSET: ${{ matrix.asset }}
      ARCHLENS_BIN: ${{ github.workspace }}/target/debug/archlens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: archlens-stable
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the offline report generator
        run: cargo +stable build --locked
      - name: Verify the offline report in Chrome
        if: matrix.asset == 'core'
        run: bun test ./tests/report_browser.test.mjs
      - name: Run report mutations
        env:
          ARCHLENS_BASELINE_ASSETS: ${{ github.workspace }}/src/report/assets
        run: bunx --bun --ignore-scripts -p @stryker-mutator/core@10.0.0 stryker run .github/report-mutations.config.mjs
      - name: Save the mutation report
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-mutations-${{ matrix.asset }}
          path: reports/mutation/mutation.json
