name: Rust coverage

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: archlens-coverage
          workspaces: . -> target/llvm-cov-target
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install coverage tools
        run: |
          rustup component add --toolchain stable llvm-tools-preview
          cargo +stable install cargo-llvm-cov --locked --version 0.9.1
      - name: Run instrumented Rust tests
        run: cargo +stable llvm-cov --locked --no-report
      - name: Write the coverage summary and HTML report
        run: |
          {
            printf '## Rust source coverage\n\n```text\n'
            cargo +stable llvm-cov report
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo +stable llvm-cov report --html --output-dir "$RUNNER_TEMP/archlens-coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archlens-rust-coverage
          path: ${{ runner.temp }}/archlens-coverage/html
          if-no-files-found: error
