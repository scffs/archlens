name: Robustness

'on':
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'Cargo.*'
      - '.cargo/mutants.toml'
      - '.github/workflows/robustness.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  mutation:
    name: Rust mutation (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["changed"]' || '["0","1","2","3","4","5","6","7"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install cargo-mutants
        run: cargo +stable install cargo-mutants --locked --version 27.1.0
      - name: Run mutation tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$SHARD" == changed ]]; then
            patch="$RUNNER_TEMP/mutation.patch"
            git diff --no-ext-diff --no-textconv --unified=0 "$BASE_SHA" HEAD -- src > "$patch"
            cargo +stable mutants --jobs 2 --output "$RUNNER_TEMP" --in-diff "$patch"
          else
            cargo +stable mutants --jobs 2 --output "$RUNNER_TEMP" --shard "$SHARD/8" --sharding round-robin
          fi
      - name: Upload mutation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-mutation-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out/
          if-no-files-found: warn
          retention-days: 14

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FUZZ_TOOLCHAIN: nightly-2026-11-28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          cargo +stable install cargo-fuzz --locked --version 0.13.2
      - name: Run AddressSanitizer fuzz tests
        shell: bash
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fetch --manifest-path fuzz/Cargo.toml --locked
          targets=$(cargo +"$FUZZ_TOOLCHAIN" fuzz list)
          test -n "$targets"

          seconds=30
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            seconds=120
          fi

          status=0
          while IFS= read -r target; do
            seeds="fuzz/seeds/$target"
            if [[ ! -d "$seeds" ]] || [[ -z "$(find "$seeds" -maxdepth 1 -type f -print -quit)" ]]; then
              printf 'No seeds for %s\n' "$target" >&2
              status=1
              continue
            fi
            mkdir -p "fuzz/corpus/$target"
            cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" "$seeds" -- "-max_total_time=$seconds" -max_len=4096 -verbosity=0 -print_final_stats=1 || status=1
          done <<< "$targets"
          exit "$status"
      - name: Upload fuzz failure inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archlens-fuzz-reproducers
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
