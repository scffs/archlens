name: Robustness

'on':
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'Cargo.*'
      - '.cargo/mutants.toml'
      - '.github/workflows/robustness.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  mutation:
    name: Rust mutation (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["changed"]' || '["0","1","2","3","4","5","6","7"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install cargo-mutants
        run: cargo +stable install cargo-mutants --locked --version 27.1.0
      - name: Run mutation tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$SHARD" == changed ]]; then
            patch="$RUNNER_TEMP/mutation.patch"
            git diff --no-ext-diff --no-textconv --unified=0 "$BASE_SHA" HEAD -- src > "$patch"
            cargo +stable mutants --jobs 2 --output "$RUNNER_TEMP" --in-diff "$patch"
          else
            cargo +stable mutants --jobs 2 --output "$RUNNER_TEMP" --shard "$SHARD/8" --sharding round-robin
          fi
      - name: Upload mutation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-mutation-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out/
          if-no-files-found: warn
          retention-days: 14

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +stable install cargo-fuzz --locked --version 0.13.2
      - name: Run address-sanitized parser fuzz smoke test
        run: |
          cargo +nightly fetch --manifest-path fuzz/Cargo.toml --locked
          mkdir -p fuzz/corpus/parse_source
          cargo +nightly fuzz run parse_source fuzz/corpus/parse_source fuzz/seeds/parse_source -- -max_total_time=30 -max_len=4096 -verbosity=0 -print_final_stats=1
