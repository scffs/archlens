name: Robustness

'on':
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - '.cargo/mutants.toml'
      - '.github/workflows/robustness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-mutants
        run: cargo +stable install cargo-mutants --locked --version 27.1.0
      - name: Run mutation tests
        run: cargo +stable mutants --jobs 2
